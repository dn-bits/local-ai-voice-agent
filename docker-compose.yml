services:
  app:
    build:
      context: .
      args:
        # CPU is the default. For NVIDIA GPUs use the overlay:
        #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
        LIVEKIT_IMAGE: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
        PYTHON_BASE: ${PYTHON_BASE:-python:3.11-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        NEMO_SPEECH_BACKEND: ${NEMO_SPEECH_BACKEND:-cpu}
    env_file:
      - path: .env
      # Per-machine settings must reach the container too. The launcher uses
      # this file for Compose interpolation, but values such as MANAGE_LIVEKIT
      # and LIVEKIT_NODE_IP are otherwise lost at the container boundary.
      - path: .env.local
        required: false
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-}
      STT_PROVIDER: ${STT_PROVIDER:-nemotron-cpp}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      STT_DEVICE: ${STT_DEVICE:-}
      STT_MODEL: ${STT_MODEL:-nemotron-speech-streaming}
      NEMOTRON_CPP_MODEL: ${NEMOTRON_CPP_MODEL:-auto}
      NEMOTRON_CPP_GPU: ${NEMOTRON_CPP_GPU:-}
      NEMO_SPEECH_BIN: ${NEMO_SPEECH_BIN:-nemo-speech}
      NEMOTRON_MODEL_NAME: ${NEMOTRON_MODEL_NAME:-nvidia/nemotron-speech-streaming-en-0.6b}
      NEMOTRON_MODEL_ID: ${NEMOTRON_MODEL_ID:-nemotron-speech-streaming}
      NEMOTRON_FP16: ${NEMOTRON_FP16:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      TTS_VOICE: ${TTS_VOICE:-af_nova}
      TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
      TURN_DETECTION: ${TURN_DETECTION:-multilingual}
      AGENT_IDLE_PROCESSES: ${AGENT_IDLE_PROCESSES:-}
      WAKE_WORD: ${WAKE_WORD:-}
      WAKE_WORD_THRESHOLD: ${WAKE_WORD_THRESHOLD:-0.5}
      LLAMA_HF_REPO: ${LLAMA_HF_REPO:-unsloth/gemma-4-E2B-it-qat-GGUF:UD-Q4_K_XL}
      LLAMA_OFFLINE: ${LLAMA_OFFLINE:-}
      LLAMA_MODEL_PATH: ${LLAMA_MODEL_PATH:-}
      LLAMA_MODEL: ${LLAMA_MODEL:-gemma-4-e2b}
      LLAMA_MODEL_ALIAS: ${LLAMA_MODEL_ALIAS:-gemma-4-e2b}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-4096}
      LLAMA_PARALLEL: ${LLAMA_PARALLEL:-4}
      LLAMA_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-0}
      DEVICE: ${DEVICE:-cpu}
      SEQUENTIAL_STARTUP: ${SEQUENTIAL_STARTUP:-0}
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${LIVEKIT_BIND_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_PORT:-7881}:7881"
      # WebRTC media over UDP. The host port must equal the container port
      # because LiveKit advertises this exact port in its ICE candidates.
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  models:
